services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kurdish-backend
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        ASPNETCORE_URLS: http://+:8080
        ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=KurdishDictionary;User Id=kurdish_user;Password=${SQL_USER_PASSWORD};TrustServerCertificate=True;"
        # Signs the login tokens. The app refuses to start in Production without it — a hardcoded
        # key would let anyone mint an admin token. Rotating it logs everyone out.
        Jwt__Key: ${JWT_KEY}
        Jwt__ExpiryDays: 7
        # First-run accounts. Change the passwords after the first login; the dashboard nags until you do.
        Seed__AdminUserName: ${SEED_ADMIN_USER:-sirwan}
        Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-sirwanjaff999@gmail.com}
        Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin@123!}
        Seed__EditorPassword: ${SEED_EDITOR_PASSWORD:-Editor@123!}
        # Root for every upload type — see the bind mount below.
        Uploads__Root: /uploads
        # Shared secret for the web tier's presence flush. Unset, PresenceApi.FlushAsync returns
        # early without a word, which is why UserPresences was empty on the server: «دوایین جار»
        # never survived a restart, and there was no way to see the live presence state from
        # outside the process when it misbehaved.
        Internal__ApiKey: ${INTERNAL_API_KEY}
    ports:
      - "6000:8080"
    volumes:
      # BIND MOUNT to the host's own upload folder (/root/uploads/jinzar), not a docker-managed
      # volume: the folder already exists on the server, is visible to the operator, and is
      # backed up with the rest of the host. A named volume would bury the files under
      # /var/lib/docker where nothing else can reach them.
      #
      # This is the root for every upload type; the app creates its own subfolders inside.
      - ${UPLOAD_ROOT:-/root/uploads/jinzar}:/uploads
    networks:
      - kurdish-net
      - greenschool_default
    restart: unless-stopped

  frontend-blazor:
    build:
      context: .
      dockerfile: frontend-blazor/Dockerfile
      args:
        # Telerik UI for Blazor comes from the authenticated Telerik feed; without these the
        # image build fails at restore with NU1101. Kept in .env rather than inline so the
        # licence credentials are not committed.
        TELERIK_USER: ${TELERIK_USER}
        TELERIK_PASS: ${TELERIK_PASS}
    container_name: kurdish-blazor
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Must match the backend's — both ends of the presence flush read the same setting.
      Internal__ApiKey: ${INTERNAL_API_KEY}
    ports:
      - "6001:8080"
    volumes:
      # Data Protection key ring. Without it the keys are regenerated inside every new container,
      # which signs every user out and invalidates their antiforgery tokens on each redeploy.
      - blazor-keys:/keys
    depends_on:
      - backend
    networks:
      - kurdish-net
    restart: unless-stopped

  frontend-nextjs:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    container_name: kurdish-nextjs
    environment:
      NODE_ENV: production
      API_URL: http://backend:8080
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - kurdish-net
    restart: unless-stopped

volumes:
  blazor-keys:

networks:
  kurdish-net:
    driver: bridge
  greenschool_default:
    external: true
