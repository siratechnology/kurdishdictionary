# ژینزار — the containerised nginx (proxies to service names on kurdish-net).
#
# Same host map as nginx/kurdish-dictionary.conf, which is the HOST nginx. The two exist for the
# two ways this is deployed and must be changed together — a domain updated in one and not the
# other is a redirect that works in staging and not in production, or the reverse.
#
#   jinzar.krd        → Next.js  (public dictionary)
#   manage.jinzar.krd → Blazor   (admin)
#   everything else   → 301 to whichever of those two it belongs to
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Canonical: public dictionary ─────────────────────────────────────
    server {
        listen 80;
        server_name jinzar.krd;

        location / {
            proxy_pass http://frontend-nextjs:4000;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── Canonical: admin ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name manage.jinzar.krd;

        location / {
            proxy_pass http://frontend-blazor:8080;

            # WebSocket support required for Blazor Server SignalR
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }

    # ── Everything else → the canonical public host ──────────────────────
    #
    # 301, permanently: this is a domain move, and a permanent redirect is what transfers search
    # ranking and what clients may cache. $request_uri is preserved so an old deep link lands on
    # the same page rather than on the front door.
    server {
        listen 80;
        server_name www.jinzar.krd jinzar.com www.jinzar.com;

        # Served, not redirected — a server-level `return 301` would swallow the ACME
        # challenge and Let's Encrypt would refuse to certify these names.
        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://jinzar.krd$request_uri;
        }
    }
}
