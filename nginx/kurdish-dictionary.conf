# ژینزار — host nginx (proxies to apps running on the host's own ports).
#
# Canonical domain is jinzar.krd. Everything else 301s to it.
#
# Domain map:
#
#   jinzar.krd                             → Next.js  (public dictionary, :4000)
#   manage.jinzar.krd                      → Blazor   (admin, :6001)
#
#   www.jinzar.krd  ─┐
#   jinzar.com       ├─ 301 → jinzar.krd
#   www.jinzar.com  ─┘
#
#   dictionary.siratechnology.com          301 → jinzar.krd
#   managedictionary.siratechnology.com    301 → manage.jinzar.krd
#
# The two old hosts redirect to their COUNTERPARTS, not both to the public site. Sending the
# old admin host to the public dictionary would strand every bookmarked admin URL on a page
# that cannot serve it, and quietly train the team that the old link is simply broken.
#
# 301 and not 302: the move is permanent, and a permanent redirect is what transfers search
# ranking and what browsers and clients are allowed to cache. A 302 leaves the old domain being
# crawled and requested forever.
#
# $request_uri is kept on every redirect, so a shared deep link survives the move — dropping it
# would land every old bookmark on the front page, which is the same as breaking it.
#
# TLS: certificates are needed for the redirecting names too, or an https://jinzar.com link fails
# in the handshake and never reaches the redirect. Issue with:
#   certbot --nginx -d jinzar.krd -d www.jinzar.krd -d manage.jinzar.krd \
#                   -d jinzar.com -d www.jinzar.com
# certbot rewrites these blocks in place to add listen 443 and the cert paths.

# ── Canonical: public dictionary ─────────────────────────────────────────
server {
    listen 80;
    server_name jinzar.krd;

    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Canonical: admin ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name manage.jinzar.krd;

    location / {
        proxy_pass         http://localhost:6001;
        proxy_http_version 1.1;

        # WebSocket upgrade is required for Blazor Server's SignalR circuit — without it the
        # admin loads as static chrome and every interactive page is dead.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── Everything else → the canonical public host ──────────────────────────
server {
    listen 80;
    server_name www.jinzar.krd jinzar.com www.jinzar.com;

    # The ACME challenge must be served, NOT redirected. A bare server-level
    # `return 301` fires in the rewrite phase and swallows this path too, so Let's Encrypt
    # follows the redirect to the canonical host, fails to find its token there, and refuses
    # to issue a certificate for these names — which then breaks the very redirect below,
    # because an https:// link to a name with no certificate dies in the handshake.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://jinzar.krd$request_uri;
    }
}

# ── Retired domain → its counterpart on the new one ──────────────────────
#
# Keep these blocks for as long as the old certificates last. Deleting them instead of
# redirecting would drop every existing inbound link and whatever search ranking the old
# domain accumulated, which is the one part of a domain move that cannot be undone later.
server {
    listen 80;
    server_name dictionary.siratechnology.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://jinzar.krd$request_uri;
    }
}

server {
    listen 80;
    server_name managedictionary.siratechnology.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # → the ADMIN host, not the public one: an old /words or /taxonomy deep link has to land
    # on the admin app that can actually serve it.
    location / {
        return 301 https://manage.jinzar.krd$request_uri;
    }
}
