org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# This project lives on D: while the pub cache (and therefore every plugin's
# Kotlin source) lives on C:. Kotlin's incremental compiler stores relocatable
# paths, and computing one across two Windows drive roots throws
# "this and base files have different roots", which fails the build outright:
#
#   Execution failed for task ':share_plus:compileDebugKotlin'
#   > Could not close incremental caches in ...\caches-jvm\jvm\kotlin
#
# Non-incremental Kotlin compilation sidesteps the path converter entirely. The
# only cost is slower rebuilds of the plugins' Kotlin, which is a handful of
# files and rarely changes. Remove this if the project and the pub cache ever
# end up on the same drive (or set PUB_CACHE onto D:).
kotlin.incremental=false
